name: Scrape and Deploy

on:
  # PAUSED 2026-08-06 per request -- schedule disabled, manual trigger still works.
  # Uncomment the schedule block below to resume automatic runs.
  # schedule:
  #   - cron: '0 15 * * *'
  #   - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    # 2026-10-01: switched to the self-hosted runner on Xavi's own PC.
    # tccsearch.org (Travis's recorder) is behind Cloudflare bot-detection
    # that serves a "Just a moment..." challenge to every GitHub-hosted
    # runner request, 0 leads every run since at least 9/27 -- confirmed
    # live 2026-10-01 that a request from this machine's own network reaches
    # the real page with no challenge at all. This repo's own CLAUDE.md
    # already flagged "run from a non-datacenter network origin" as the one
    # legitimate option worth trying (explicitly distinct from the firm
    # standing policy against bypass/stealth tooling -- no proxies, no
    # undetected-chromedriver-style packages, none of that here, just a
    # different real network). Real tradeoff: this only runs while the
    # runner process is alive on Xavi's machine, unlike the other counties.
    runs-on: [self-hosted, Windows, local]
    environment:
      name: github-pages
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      # 2026-10-01: actions/setup-python fails on this fresh self-hosted
      # Windows runner -- it tries to download+install its own standalone
      # Python 3.11.9 (not yet in this runner's tool cache) and the
      # installer script breaks ("'python-3.11.9-amd64.exe' is not
      # recognized"), a known flaky path for setup-python on a Windows
      # runner with no pre-warmed cache. This machine already has Python
      # 3.14.4 on PATH (confirmed live) -- just use it directly instead of
      # fighting the installer.
      - name: Install dependencies
        run: pip install requests selenium webdriver-manager homeharvest

      - name: Run python scraper/fetch.py
        run: python scraper/fetch.py

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Clear stuck Pages deployments
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: pages_try1
        continue-on-error: true
      - name: Clear stuck Pages deployments (retry)
        if: steps.pages_try1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages (retry)
        if: steps.pages_try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
