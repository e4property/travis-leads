name: Scrape and Deploy

on:
  # PAUSED 2026-08-06 per request -- schedule disabled, manual trigger still works.
  # Uncomment the schedule block below to resume automatic runs.
  # schedule:
  #   - cron: '0 15 * * *'
  #   - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    # 2026-10-01: switched to the self-hosted runner on Xavi's own PC.
    # tccsearch.org (Travis's recorder) is behind Cloudflare bot-detection
    # that serves a "Just a moment..." challenge to every GitHub-hosted
    # runner request, 0 leads every run since at least 9/27 -- confirmed
    # live 2026-10-01 that a request from this machine's own network reaches
    # the real page with no challenge at all. This repo's own CLAUDE.md
    # already flagged "run from a non-datacenter network origin" as the one
    # legitimate option worth trying (explicitly distinct from the firm
    # standing policy against bypass/stealth tooling -- no proxies, no
    # undetected-chromedriver-style packages, none of that here, just a
    # different real network). Real tradeoff: this only runs while the
    # runner process is alive on Xavi's machine, unlike the other counties.
    runs-on: [self-hosted, Windows, local]
    environment:
      name: github-pages
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests selenium webdriver-manager homeharvest

      - name: Run python scraper/fetch.py
        run: python scraper/fetch.py

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - uses: actions/deploy-pages@v4
